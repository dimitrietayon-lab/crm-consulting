<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akquise-App · Klickbarer Prototyp (Zusammenführung)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563eb; --blue-700:#1d4ed8; --blue-50:#eff6ff; --blue-100:#dbeafe;
    --ink:#111827; --muted:#6b7280; --muted2:#9ca3af;
    --line:#e5e7eb; --line2:#f3f4f6; --bg:#f8fafc; --card:#fff;
    --green:#16a34a; --green-bg:#dcfce7; --green-700:#15803d;
    --red:#dc2626; --red-bg:#fef2f2; --red-700:#b91c1c;
    --amber:#b45309; --amber-bg:#fef3c7;
    --violet:#6d28d9; --violet-bg:#f5f3ff;
    --cyan:#0e7490; --cyan-bg:#ecfeff;
    --slate:#0f172a; --slate-800:#1e293b; --slate-700:#334155; --slate-300:#cbd5e1;
    --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  .shell{display:flex;min-height:100vh}
  .sidebar{width:248px;flex:none;background:var(--slate);color:var(--slate-300);padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex:none}
  .brand-name{font-size:14px;font-weight:800;color:#fff;letter-spacing:-.01em}
  .brand-sub{font-size:10px;color:#94a3b8;margin-top:1px}
  .nav-group{margin-bottom:14px}
  .nav-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#64748b;padding:0 8px;margin-bottom:5px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;font-size:12.5px;color:var(--slate-300);margin-bottom:1px;cursor:pointer}
  .nav-item:hover{background:var(--slate-800);color:#fff}
  .nav-item.active{background:var(--slate-700);color:#fff;font-weight:600}
  .nav-item .di{width:6px;height:6px;border-radius:2px;background:#475569;flex:none}
  .nav-item.active .di{background:#60a5fa}
  .nav-item .count{margin-left:auto;font-size:9.5px;font-weight:700;background:#1e293b;color:#94a3b8;padding:1px 6px;border-radius:20px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;position:sticky;top:0;z-index:30}
  .tb-left{min-width:0}
  .crumbs{font-size:11.5px;color:var(--muted2);display:flex;align-items:center;gap:6px;margin-bottom:1px;flex-wrap:wrap}
  .crumbs b{color:#374151;font-weight:600}
  .crumbs .sep{color:#d1d5db}
  .tb-title{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .content{width:100%;max-width:1320px;margin:0 auto;padding:20px 24px 48px}
  .mocklet{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#6d28d9;background:var(--violet-bg);border:1px solid #ddd6fe;border-radius:20px;padding:2px 9px;white-space:nowrap}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;font-size:13px;font-weight:600;padding:8px 13px;border:1px solid transparent;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-700)}
  .btn-primary:disabled{background:#c7d2e3;cursor:not-allowed}
  .btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#15803d}
  .btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#b91c1c}
  .btn-ghost{background:#fff;color:#374151;border-color:var(--line)}
  .btn-ghost:hover{background:#f9fafb}
  .btn-link{background:transparent;color:var(--muted);padding:4px 2px;font-size:12px}
  .btn-link:hover{color:#111827}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card+.card{margin-top:16px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .card-title{font-size:13px;font-weight:700;letter-spacing:-.01em}
  .card-body{padding:16px 18px}
  .grid{display:grid;gap:16px;align-items:start}
  .g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g-main{grid-template-columns:minmax(0,1fr) 360px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
  .kpi-label{font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
  .kpi-value{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .kpi-hint{font-size:10.5px;color:var(--muted2);margin-top:2px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
  .badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
  .b-gray{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
  .b-blue{background:var(--blue-50);color:var(--blue-700);border-color:var(--blue-100)}
  .b-cyan{background:var(--cyan-bg);color:var(--cyan);border-color:#cffafe}
  .b-amber{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
  .b-violet{background:var(--violet-bg);color:var(--violet);border-color:#ede9fe}
  .b-green{background:var(--green-bg);color:var(--green-700);border-color:#bbf7d0}
  .b-red{background:var(--red-bg);color:var(--red-700);border-color:#fecaca}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--line);background:#fff;color:#374151}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
  .pill.target{background:var(--blue);border-color:var(--blue);color:#fff}
  .pill.target .dot{background:#fff}
  .muted{color:var(--muted)}.muted2{color:var(--muted2)}
  .tiny{font-size:11px}
  .sec-title{font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
  .rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .table-wrap{overflow-x:auto}
  .table{width:100%;border-collapse:collapse;font-size:12.5px}
  .table th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:#f9fafb;white-space:nowrap}
  .table td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
  .table tbody tr:hover td{background:#fafbff}
  .table a{color:var(--blue-700);font-weight:600}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .input,.select,textarea.input{width:auto;border:1px solid #d1d5db;border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;color:#111827;background:#fff;outline:none}
  .input:focus,.select:focus,textarea.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
  .input.wide{min-width:220px}
  .select{padding-right:26px}
  textarea.input{width:100%;resize:vertical;min-height:76px;line-height:1.5}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/-1}
  .field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2)}
  .field label .req{color:var(--red)}
  .field .hintline{font-size:10.5px;color:var(--muted2)}
  .checklist{display:flex;flex-direction:column;gap:7px}
  .check{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
  .check:hover{border-color:#c7d2fe;background:#fafbff}
  .check input{appearance:none;-webkit-appearance:none;width:18px;height:18px;flex:none;margin-top:1px;border:1.5px solid #cbd5e1;border-radius:5px;background:#fff;cursor:pointer;position:relative}
  .check input:checked{background:var(--blue);border-color:var(--blue)}
  .check input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check.is-done .check-text{color:var(--muted2);text-decoration:line-through}
  .check-body{min-width:0;display:flex;flex-direction:column;gap:2px}
  .check-text{font-size:12.5px;font-weight:500;color:#1f2937;line-height:1.4}
  .check-hint{font-size:10.5px;color:var(--muted2);line-height:1.4}
  .tag{margin-left:auto;flex:none;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:20px;margin-top:1px}
  .tag.auto{background:#e0f2fe;color:#0369a1}
  .tag.manual{background:var(--amber-bg);color:var(--amber)}
  .exit-check input:checked{background:var(--green);border-color:var(--green)}
  .counter{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:#f1f5f9;color:#475569}
  .counter.ok{background:var(--green-bg);color:var(--green-700)}
  .progress{height:7px;border-radius:20px;background:#eef2f7;overflow:hidden}
  .progress>span{display:block;height:100%;background:var(--blue);border-radius:20px;transition:width .3s}
  .banner{display:flex;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid;margin-bottom:14px;font-size:12.5px;line-height:1.5}
  .banner.red{background:var(--red-bg);border-color:#fecaca;color:#7f1d1d}
  .banner.blue{background:var(--blue-50);border-color:var(--blue-100);color:#1e3a8a}
  .banner.amber{background:#fffbeb;border-color:#fde68a;color:#78350f}
  .kanban{display:grid;grid-template-columns:repeat(5,minmax(232px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
  .kan-col{background:#f1f5f9;border:1px solid var(--line);border-radius:12px;padding:9px;min-height:200px;transition:background .12s,border-color .12s}
  .kan-col.over{border-color:#93c5fd;background:var(--blue-50)}
  .kan-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:2px 3px}
  .kan-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#64748b}
  .kan-count{font-size:10px;font-weight:700;background:#e2e8f0;color:#475569;padding:1px 7px;border-radius:20px}
  .kan-card{display:block;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .kan-card:hover{border-color:#bfdbfe;box-shadow:0 3px 8px rgba(37,99,235,.09)}
  .kan-card.dragging{opacity:.4}
  .kan-card .co{font-size:12.5px;font-weight:700;line-height:1.3}
  .kan-card .meta{font-size:10.5px;color:var(--muted2);margin-top:2px}
  .kan-card .foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;flex-wrap:wrap}
  .kan-card .mini{font-size:9.5px;color:#64748b;background:#f1f5f9;border-radius:20px;padding:1px 6px;font-weight:600}
  .stage{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;background:#fff}
  .stage.done{border-color:#bbf7d0;background:#f7fefb}
  .stage.current{border-color:#bfdbfe;background:var(--blue-50)}
  .stage.locked{background:#fbfbfc;opacity:.75}
  .stage-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .stage-num{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;background:#eef2f7;color:#94a3b8;flex:none}
  .stage.done .stage-num{background:var(--green-bg);color:var(--green-700)}
  .stage.current .stage-num{background:var(--blue);color:#fff}
  .stage-name{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8}
  .stage.done .stage-name{color:var(--green-700)}
  .stage.current .stage-name{color:var(--blue-700)}
  .steps{display:flex;flex-direction:column;gap:2px}
  .step-row{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 4px;border-radius:6px;color:var(--muted)}
  .step-row .sdot{width:6px;height:6px;border-radius:50%;background:#dbe2ea;flex:none}
  .step-row.done{color:#475569}.step-row.done .sdot{background:var(--green)}
  .step-row.current{background:#fff;color:var(--blue-700);font-weight:700;box-shadow:inset 0 0 0 1px #dbeafe;cursor:pointer}
  .step-row.current .sdot{background:var(--blue)}
  .step-row.open{cursor:pointer;color:#475569}.step-row.open:hover{background:#f8faff}
  .step-row.locked{color:#b6c2cf}
  .mini-b{margin-left:auto;font-size:9px;font-weight:700;color:#64748b;background:#f1f5f9;border-radius:20px;padding:1px 6px;white-space:nowrap}
  .mini-b.ok{background:var(--green-bg);color:var(--green-700)}
  .mini-b.lock{background:transparent;color:#cbd5e1}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tab{appearance:none;background:none;border:none;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tab:hover{color:#111827}
  .tab.active{color:var(--blue-700);border-bottom-color:var(--blue)}
  .timeline{display:flex;flex-direction:column}
  .tl{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
  .tl:last-child{border-bottom:none}
  .tl-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:none;background:#f1f5f9;color:#64748b}
  .tl-ic.call{background:#eff6ff;color:#1d4ed8}.tl-ic.meeting{background:#fffbeb;color:#b45309}
  .tl-ic.email{background:#ecfeff;color:#0e7490}.tl-ic.linkedin{background:#eef2ff;color:#4338ca}
  .tl-ic.note{background:#f3f4f6;color:#4b5563}.tl-ic.task{background:#ecfdf5;color:#047857}
  .tl-body{flex:1;min-width:0}
  .tl-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .tl-type{font-size:11px;font-weight:700;color:#374151}
  .tl-date{font-size:10px;color:var(--muted2);white-space:nowrap}
  .tl-sum{font-size:12px;color:#4b5563;margin-top:1px;line-height:1.4}
  .tl-next{font-size:11px;color:var(--blue-700);margin-top:2px}
  .empty{text-align:center;padding:28px 12px;color:var(--muted2);font-size:12.5px}
  .av{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:#475569;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;border:2px solid #fff;margin-left:-6px}
  .av:first-child{margin-left:0}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag2{font-size:10px;padding:1px 7px;border-radius:20px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
  .code{background:var(--slate);color:#e2e8f0;border-radius:10px;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.6;overflow:auto;white-space:pre}
  .code .c{color:#64748b}.code .k{color:#93c5fd}.code .s{color:#86efac}
  .funnel{display:flex;flex-direction:column;gap:7px}
  .frow{display:flex;align-items:center;gap:10px}
  .flabel{width:120px;font-size:11px;color:#475569;flex:none}
  .fbar{flex:1;height:22px;background:#f1f5f9;border-radius:6px;overflow:hidden;position:relative}
  .fbar>span{display:block;height:100%;background:var(--blue);border-radius:6px}
  .fval{width:34px;text-align:right;font-size:11px;font-weight:700;color:#374151;flex:none}
  .calc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bigval{font-size:24px;font-weight:800;color:var(--green-700);letter-spacing:-.02em}
  /* KI-Assistent */
  .ai-card{border-color:#c7d2fe;background:linear-gradient(180deg,#f5f7ff,#fff)}
  .ai-card .card-head{border-bottom-color:#e0e7ff}
  .ai-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .ai-spark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#2563eb);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 8px rgba(79,70,229,.25)}
  .ai-spark svg{width:17px;height:17px}
  .ai-kicker{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#4f46e5}
  .ai-chip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#4338ca;background:#eef2ff;border:1px solid #e0e7ff;border-radius:20px;padding:2px 8px;flex:none}
  .ai-actions{display:flex;flex-direction:column;gap:7px}
  .ai-actions .btn{justify-content:flex-start;width:100%}
  .ai-out{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.65;color:#1f2937;white-space:pre-wrap}
  .ai-out .ai-subject{font-weight:800;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ai-line{padding:2px 0}
  .ai-foot-note{font-size:10.5px;color:var(--muted2);margin-top:8px}
  #modal-root{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(15,23,42,.45);z-index:80;padding:40px 20px;overflow-y:auto}
  #modal-root.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(15,23,42,.3);margin:auto}
  .modal.wide{max-width:820px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line2)}
  .modal-title{font-size:14px;font-weight:800}
  .xbtn{border:none;background:#f1f5f9;color:#475569;width:28px;height:28px;border-radius:8px;font-size:16px;cursor:pointer;line-height:1}
  .xbtn:hover{background:#e2e8f0}
  .modal-body{padding:18px 20px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2)}
  .toast{position:fixed;right:24px;bottom:24px;background:var(--slate);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 12px 30px rgba(15,23,42,.3);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none;max-width:420px;z-index:90}
  .toast.show{opacity:1;transform:none}
  .toast.err{background:#7f1d1d}
  .toast b{color:#93c5fd}
  .toast.err b{color:#fecaca}
  @media (max-width:1150px){.g-main{grid-template-columns:1fr}.sidebar{display:none}.g4{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:760px){.g2,.g3,.calc{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 14px}.tb-right .mocklet{display:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main"><div id="viewport"></div></div>
</div>
<div id="modal-root"></div>

  /* ═══════════════ Pipeline logic ═══════════════ */
  function isSelectable(cur, next) {
    const ns = stepByStatus(next);
    if (!ns) return false;
    if (cur === next) return true;
    if (LOST.includes(next)) return true;
    if (cur === 'kontaktiert' && next === 'Übergabe an Engagement Manager') return true;
    const ci = stageIdxOfStatus(cur), ni = stageIdxOfStatus(next);
    if (ni < 0) return false;
    if (ci < 0) return ni === 0;
    if (ni < ci) return true;
    if (ni === ci) {
      const list = stepsOfStage(STAGES[ci].key);
      const a = list.findIndex((s) => s.status === cur);
      const b = list.findIndex((s) => s.status === next);
      return b <= a || b === a + 1;
    }
    const list = stepsOfStage(STAGES[ci].key);
    const atEnd = cur === (list[list.length - 1] || {}).status;
    if (!(ni === ci + 1 && atEnd)) return false;
    if (ni === STAGES.length - 1) return true;
    const nextList = stepsOfStage(STAGES[ni].key);
    return (nextList[0] || {}).status === next;
  }
  function nextUnlocked(cur) {
    const idx = STEPS.findIndex((s) => s.status === cur);
    const order = STEPS.slice(idx + 1).concat(STEPS.slice(0, Math.max(idx, 0)));
    const hit = order.find((s) => isSelectable(cur, s.status));
    return hit ? hit.status : null;
  }
  function progressPct(status) {
    const st = stepByStatus(status); if (!st) return 0;
    const si = STAGES.findIndex((x) => x.key === st.stage);
    const list = stepsOfStage(st.stage);
    const i = list.findIndex((s) => s.status === status);
    return Math.round(((si + (i + 1) / (list.length || 1)) / STAGES.length) * 100);
  }

    if (kind === 'num') return Number(t[key]) > 0;
    if (kind === 'activity') return DB.activities.some((a) => a.targetId === t.id && (!key || a.type === key));
    if (kind === 'offers') return DB.offers.some((o) => o.targetId === t.id && o.status === key);

  }

        (key === 'akquise' ? '<span class="count">' + DB.targets.filter((t) => !isLost(t.status)).length + '</span>' : '') + '</a>'
      ).join('') + '</div>'
    ).join('');
  }
  function markNav(key) {
    qa('.nav-item').forEach((n) => n.classList.toggle('active', n.dataset.nav === key));
  }
  function topbar(v) {
    return '<header class="topbar"><div class="tb-left"><div class="crumbs">' + (v.crumbs || '') + '</div><div class="tb-title">' + esc(v.title || '') + '</div></div>' +
      '<div class="tb-right"><span class="mocklet">Prototyp · klickbar</span>' + (v.actions || '') +
      '<button class="btn btn-ghost btn-sm" data-act="resetDemo">Demo zurücksetzen</button></div></header>';
  }
  function route() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const parts = raw.split('?');
    const segs = parts[0].split('/').filter(Boolean);
    const query = {};
    new URLSearchParams(parts[1] || '').forEach((val, key) => { query[key] = val; });
    return { segs, query };
  }
  function render() {
    const r = route();
    const v = resolve(r);
    el('viewport').innerHTML = topbar(v) + '<div class="content">' + v.body + '</div>';
    markNav(r.segs[0] || 'dashboard');
    window.scrollTo(0, 0);
    if (v.after) v.after();
  }

  /* ═══════════════ Views ═══════════════ */
  const emptyBox = (txt) => '<div class="empty">' + esc(txt) + '</div>';
  const card = (title, body, actions) => '<section class="card"><div class="card-head"><div class="card-title">' + esc(title) + '</div>' + (actions || '') + '</div><div class="card-body">' + body + '</div></section>';
  const kpi = (label, value, hint) => '<div class="kpi"><div class="kpi-label">' + esc(label) + '</div><div class="kpi-value">' + value + '</div><div class="kpi-hint">' + esc(hint || '') + '</div></div>';

  function resolve(r) {
    const p = r.segs;
    if (!p.length || p[0] === 'dashboard') return viewDashboard();
    if (p[0] === 'me') return viewMe();
    if (p[0] === 'akquise') {
      if (p.length === 1) return viewTargets();
      const t = findTarget(p[1]);
      if (!t) return viewNotFound();
      if (p.length === 2) return viewTargetDetail(t);
      if (p[2] === 'edit') return viewTargetEdit(t);
      if (p[2] === 'prozess') return p[3] ? viewStep(t, p[3]) : viewProcess(t);
      if (p[2] === 'assessment') return viewAssessment(t);
      if (p[2] === 'proposals') return viewProposals(t);
      if (p[2] === 'handover') return viewHandover(t);
    }
    if (p[0] === 'offers') {
      if (p.length === 1) return viewOffers();
      if (p[1] === 'new') return viewOfferNew();
      const o = findOffer(p[1]); if (!o) return viewNotFound();
      return viewOfferDetail(o);
    }
    if (p[0] === 'team') {
      if (p.length === 1) return viewTeam();
      if (p[1] === 'zuweisung' && p[2]) { const t = findTarget(p[2]); return t ? viewAssignment(t) : viewNotFound(); }
      return viewMember(p[1]);
    }
    const map = { outreach: viewOutreach, contacts: viewContacts, reporting: viewReporting, market: viewMarket, capacity: viewCapacity, bafa: viewBafa, import: viewImport, blocklist: viewBlocklist, settings: viewSettings, activities: viewActivities, tasks: viewTasks, documents: viewDocuments, accounts: viewAccounts, contracts: viewContracts, playbook: viewPlaybook };
    if (map[p[0]]) return map[p[0]]();
    return viewNotFound();
  }

  function viewNotFound() {
    return { title:'Nicht gefunden', crumbs:'<b>Fehler</b>', actions:'', body: emptyBox('Diese Seite existiert im Prototyp nicht.') + '<div style="text-align:center"><a class="btn btn-primary" href="#/akquise">Zu den Zielkunden</a></div>' };
  }

  /* ── Dashboard / Heute ───────────────────────────────────── */
  function viewDashboard() {
    const active = DB.targets.filter((t) => isInTalk(t.status) || isOfferStatus(t.status));
    const won = DB.targets.filter((t) => WON.includes(t.status));
    const lost = DB.targets.filter((t) => LOST.includes(t.status));
    const pipelineValue = DB.targets.filter((t) => isInTalk(t.status) || isOfferStatus(t.status)).reduce((s, t) => s + (t.offerValue || 0), 0);
    const wonValue = won.reduce((s, t) => s + (t.offerValue || 0), 0);
    const next7 = (() => { const d = new Date(); d.setDate(d.getDate() + 7); return d.toISOString().slice(0, 10); })();
    const agenda = DB.targets.filter((t) => t.nextStepDue && t.nextStepDue <= next7 && !isLost(t.status)).sort((a, b) => (a.nextStepDue < b.nextStepDue ? -1 : 1));
    const funnel = STAGES.map((s) => ({ label:s.label, count:DB.targets.filter((t) => (stepByStatus(t.status) || {}).stage === s.key).length }));
    const maxStage = Math.max.apply(null, funnel.map((f) => f.count).concat([1]));
    const top = DB.targets.filter((t) => t.offerValue > 0 && !isLost(t.status)).sort((a, b) => b.offerValue - a.offerValue).slice(0, 5);
    const recent = DB.activities.slice(0, 6);

    const body =
      '<div class="kpis">' +
        kpi('Zielkunden', DB.targets.length, active.length + ' aktiv') +
        kpi('Aktive Opportunities', active.length, 'Qualifizierung bis Angebot') +
        kpi('Pipeline-Wert', eur(pipelineValue), 'Im Gespräch + Angebote') +
        kpi('Gewonnen', eur(wonValue), won.length + ' Kunden') +
        kpi('Verloren', lost.length, 'inkl. kein Interesse') +
      '</div>' +
      '<div class="grid g2">' +
        card('Heute &amp; nächste 7 Tage', agenda.length ? agenda.map((t) =>
          '<div class="tl"><div class="tl-ic ' + (t.nextStepDue < todayISO() ? 'note' : 'meeting') + '">' + (t.nextStepDue < todayISO() ? '!' : '•') + '</div><div class="tl-body"><div class="tl-top"><a class="tl-type" href="#/akquise/' + t.id + '">' + esc(t.companyName) + '</a><span class="tl-date">' + dfmt(t.nextStepDue) + '</span></div><div class="tl-sum">' + esc(t.nextStep || 'Nächster Schritt') + '</div></div></div>'
        ).join('') : emptyBox('Keine fälligen Follow-ups.'), '<a class="btn-link" href="#/akquise">Alle</a>') +
        card('Funnel', '<div class="funnel">' + funnel.map((f) =>
          '<div class="frow"><div class="flabel">' + esc(f.label) + '</div><div class="fbar"><span style="width:' + Math.round((f.count / maxStage) * 100) + '%"></span></div><div class="fval">' + f.count + '</div></div>'
        ).join('') + '</div>') +
      '</div>' +
      '<div class="grid g2" style="margin-top:16px">' +
        card('Top-Zielkunden', top.length ? '<div class="table-wrap"><table class="table"><thead><tr><th>Unternehmen</th><th>Status</th><th style="text-align:right">Wert</th></tr></thead><tbody>' + top.map((t) =>
          '<tr><td><a href="#/akquise/' + t.id + '">' + esc(t.companyName) + '</a></td><td>' + statusBadge(t.status) + '</td><td style="text-align:right;font-weight:700">' + eur(t.offerValue) + '</td></tr>'
        ).join('') + '</tbody></table></div>' : emptyBox('Keine Angebote.')) +
        card('Letzte Aktivitäten', recent.map(activityRow).join('') || emptyBox('Keine Aktivitäten.'), '<a class="btn-link" href="#/activities">Alle</a>') +
      '</div>' +
      '<div style="margin-top:16px">' + aiCard('KI-Insights', '<div class="ai-head">' + AI_SPARK + '<div class="tiny muted">Automatisch aus den aktuellen Daten abgeleitet.</div><button class="btn btn-ghost btn-sm" style="margin-left:auto" data-act="ai" data-kind="insights">Öffnen</button></div><div class="ai-out">' + aiInsights().map((x) => '<div class="ai-line">' + esc(x) + '</div>').join('') + '</div>') + '</div>';
    return { title:'Akquise-Übersicht', crumbs:'<b>Dashboard</b>', actions:'<a class="btn btn-primary btn-sm" href="#/akquise">Zu den Zielkunden</a>', body };
  }
  function activityRow(a) {
    const cls = (a.type || '').toLowerCase();
    const t = findTarget(a.targetId);
    return '<div class="tl"><div class="tl-ic ' + cls + '">' + esc((a.type || '?').slice(0, 1)) + '</div><div class="tl-body"><div class="tl-top"><span class="tl-type">' + esc(a.type) + (t ? ' · ' + esc(t.companyName) : '') + '</span><span class="tl-date">' + dfmt(a.date) + '</span></div><div class="tl-sum">' + esc(a.summary || '') + '</div>' + (a.nextSteps ? '<div class="tl-next">→ ' + esc(a.nextSteps) + '</div>' : '') + '</div></div>';
  }

        card('Follow-ups', followUps.map((t) => '<div class="tl"><div class="tl-ic ' + (t.nextStepDue < todayISO() ? 'note' : 'meeting') + '">•</div><div class="tl-body"><div class="tl-top"><a class="tl-type" href="#/akquise/' + t.id + '">' + esc(t.companyName) + '</a><span class="tl-date">' + dfmt(t.nextStepDue) + '</span></div><div class="tl-sum">' + esc(t.nextStep || '') + '</div></div></div>').join('') || emptyBox('Keine Follow-ups.')) +

  /* ── Zielkunde Detail ────────────────────────────────────── */
  function stageStrip(t) {
    const cur = stepByStatus(t.status);
    const curOrder = cur ? cur.order : 0;
    const currentStageIdx = stageIdxOfStatus(t.status);
    const tabs = STAGES.map((s, i) => {
      const list = stepsOfStage(s.key);
      const done = list.filter((x) => x.order < curOrder).length;
      const active = (UI.detailTab || (STAGES[currentStageIdx] || STAGES[0]).key) === s.key;
      return '<button class="tab ' + (active ? 'active' : '') + '" data-act="detailTab" data-tab="' + s.key + '">' + esc(s.label) + ' · ' + done + '/' + list.length + '</button>';
    }).join('') + '<button class="tab ' + ((UI.detailTab === 'ueberblick') ? 'active' : '') + '" data-act="detailTab" data-tab="ueberblick">Überblick</button>';

    const activeKey = UI.detailTab || (STAGES[currentStageIdx] || STAGES[0]).key;
    let inner;
    if (activeKey === 'ueberblick') {
      const next = nextUnlocked(t.status);
      const ns = next ? stepByStatus(next) : null;
      inner = '<div class="grid g2"><div><div class="tiny muted2" style="margin-bottom:4px">AKTUELLER STAND</div><div style="font-weight:800;font-size:15px">' + esc(statusLabel(t.status)) + '</div><div class="tiny muted">Stufe ' + (currentStageIdx + 1) + ' von ' + STAGES.length + ' · ' + progressPct(t.status) + '%</div><div class="progress" style="margin-top:8px"><span style="width:' + progressPct(t.status) + '%"></span></div></div>' +
        (ns ? '<div class="banner blue" style="margin:0"><div><div class="tiny" style="font-weight:800">NÄCHSTER SCHRITT</div><div style="font-weight:700">' + esc(ns.title) + '</div><div class="tiny muted">' + esc(ns.desc) + '</div><a class="btn btn-primary btn-sm" style="margin-top:8px" href="#/akquise/' + t.id + '/prozess/' + ns.slug + '">Schritt öffnen</a></div></div>' : '<div class="banner amber" style="margin:0">Prozess beendet.</div>') + '</div>';
    } else {
      const list = stepsOfStage(activeKey);
      inner = list.map((s) => {
        const isCur = s.status === t.status;
        const done = s.order < curOrder;
        const unlocked = isSelectable(t.status, s.status);
        const clickable = done || isCur || unlocked;
        const st = 'step-row ' + (isCur ? 'current' : done ? 'done' : clickable ? 'open' : 'locked');
        const badge = done ? '<span class="mini-b ok">Exit ✓</span>' : isCur ? '<span class="mini-b">L ' + guideDone(t, s) + '/' + (s.guide || []).length + ' · E ' + exitCount(t, s) + '/' + (s.exit || []).length + '</span>' : clickable ? '<span class="mini-b">offen</span>' : '<span class="mini-b lock">gesperrt</span>';
        return '<a class="' + st + '"' + (clickable ? ' href="#/akquise/' + t.id + '/prozess/' + s.slug + '"' : '') + '><span class="sdot"></span><span>' + esc(s.label) + '</span>' + badge + '</a>';
      }).join('');
    }
    return '<section class="card"><div class="tabs">' + tabs + '</div><div class="card-body" style="padding-top:4px">' + inner + '</div></section>';
  }

        '<div class="field full"><label>Link</label><div class="tiny">' + (t.selfTestLink ? '<a href="' + esc(t.selfTestLink) + '" target="_blank" style="color:var(--blue-700)">' + esc(t.selfTestLink) + '</a>' : '—') + '</div></div>' +
      '</div>';

    const prozess =
      '<div class="fields">' +
        '<div class="field"><label>Übergabe EM</label><div class="tiny">' + dfmt(t.handoverDate) + '</div></div>' +
        '<div class="field"><label>Erstgespräch</label><div class="tiny">' + dfmt(t.firstMeetingDate) + '</div></div>' +
        '<div class="field"><label>Angebotswert</label><div class="tiny">' + (t.offerValue ? eur(t.offerValue) : '—') + '</div></div>' +
        '<div class="field"><label>Förderstatus</label><div class="tiny">' + esc(t.bafaStatus || '—') + '</div></div>' +
        '<div class="field"><label>Ergebnis</label><div class="tiny">' + esc(t.result || '—') + '</div></div>' +
        '<div class="field"><label>Verlustgrund</label><div class="tiny">' + esc(t.lossReason || '—') + '</div></div>' +
      '</div>';

    const tasksHtml = tasks.length ? tasks.map((k) => '<div class="tl"><div class="tl-ic task">A</div><div class="tl-body"><div class="tl-top"><span class="tl-type">' + esc(k.title) + '</span><span class="tl-date">' + dfmt(k.dueDate) + '</span></div><div class="tl-sum">' + esc(k.status) + ' · ' + esc(user(k.assignedToId).name) + '</div></div></div>').join('') : emptyBox('Keine offenen Aufgaben.');
    const docsHtml = docs.length ? docs.map((d) => '<div class="tl"><div class="tl-ic note">D</div><div class="tl-body"><div class="tl-top"><span class="tl-type">' + esc(d.name) + '</span><span class="tl-date">' + dfmt(d.createdAt) + '</span></div></div></div>').join('') : emptyBox('Keine Dokumente.');

    const assessments = (t.assessments || []).slice().reverse();
    const assessHtml = assessments.length ? assessments.map((a) => '<div class="tl"><div class="tl-ic note">KI</div><div class="tl-body"><div class="tl-top"><a class="tl-type" href="#/akquise/' + t.id + '/assessment">Version ' + a.version + '</a><span class="tl-date">' + dfmt(a.createdAt) + '</span></div><div class="tl-sum">Score ' + a.score + ' / 5 · ' + esc(a.usecases.length) + ' Use Cases</div></div></div>').join('') : emptyBox('Noch kein Assessment.');

    const body =
      (blocked ? '<div class="banner red"><div><b>Kontaktsperre · DSGVO Art. 21</b><br>Widerspruch dokumentiert. Kontaktaufnahme gesperrt, nur interne Doku.</div></div>' : '') +
      '<div class="kpis">' + kpi('Status', statusBadge(t.status), 'Prio ' + t.priority) + kpi('Angebotswert', t.offerValue ? eur(t.offerValue) : '—', t.offerDate ? dfmt(t.offerDate) : 'kein Angebot') + kpi('Anrufe', (t.callAttempts || 0) + ' / 3', (t.callAttempts || 0) >= 3 ? 'Limit erreicht' : 'im Rahmen') + kpi('Letzte Aktivität', first ? dfmt(first.date) : '—', acts.length + ' Einträge') + '</div>' +
      (t.account ? '<div class="banner blue" style="margin-top:0"><div>Account verknüpft: <b>' + esc(t.account) + '</b> · <a href="#/accounts" style="color:var(--blue-700)">alle Accounts</a></div></div>' : '') +
      stageStrip(t) +
      '<div class="grid g-main" style="margin-top:16px"><div>' +
        card('Stammdaten', stamm) +
        '<div class="card"><div class="card-head"><div class="card-title">Akquise-Tracking</div></div><div class="card-body">' + tracking + '</div></div>' +
        '<div class="card"><div class="card-head"><div class="card-title">Datenschutz &amp; Einwilligungen</div></div><div class="card-body">' + privacy + '</div></div>' +
        '<div class="card"><div class="card-head"><div class="card-title">Selbsttest</div></div><div class="card-body">' + selftest + '</div></div>' +
        '<div class="card"><div class="card-head"><div class="card-title">Prozessfortschritt</div></div><div class="card-body">' + prozess + '</div></div>' +
        '<div class="grid g2"><div>' + card('Aufgaben', tasksHtml, '<a class="btn-link" href="#/tasks">Alle</a>') + '</div><div>' + card('Dokumente', docsHtml, '<a class="btn-link" href="#/documents">Alle</a>') + '</div></div>' +
      '</div><div>' +
        card('Aktionen',
          '<div style="display:flex;flex-direction:column;gap:8px">' +
          '<button class="btn btn-ghost" data-act="qualify" data-id="' + t.id + '"' + (blocked || !canQualify ? ' disabled' : '') + '>Qualifizieren &amp; übergeben</button>' +
          '<button class="btn btn-ghost" data-act="logActivity" data-id="' + t.id + '">Aktivität protokollieren</button>' +
          '<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><span class="ai-chip">KI</span><span class="tiny muted2">Assistent</span></div>' +
          '<button class="btn btn-ghost" data-act="ai" data-kind="research" data-id="' + t.id + '">Unternehmen recherchieren</button>' +
          '<button class="btn btn-ghost" data-act="ai" data-kind="email" data-id="' + t.id + '">E-Mail-Entwurf</button>' +
          '<button class="btn btn-ghost" data-act="ai" data-kind="summary" data-id="' + t.id + '">Aktivitäten zusammenfassen</button>' +
          '<button class="btn btn-ghost" data-act="ai" data-kind="nextsteps" data-id="' + t.id + '">Nächsten Schritt vorschlagen</button>' +
          '<a class="btn btn-ghost" href="#/akquise/' + t.id + '/assessment">KI-Assessment</a>' +
          '<a class="btn btn-ghost" href="#/akquise/' + t.id + '/proposals">Projektvorschläge</a>' +
          '<a class="btn btn-ghost" href="#/offers/new?target=' + t.id + '"' + (blocked || !canOffer ? ' style="pointer-events:none;opacity:.5"' : '') + '>Angebot anlegen</a>' +
          '<a class="btn btn-ghost" href="#/akquise/' + t.id + '/handover">Übergabe-Checkliste</a>' +
          '</div>') +
        card('KI-Assessments', assessHtml, '<a class="btn-link" href="#/akquise/' + t.id + '/assessment">Öffnen</a>') +
        card('Aktivitäten', acts.map(activityRow).join('') || emptyBox('Noch keine Aktivitäten.'), '<button class="btn-link" data-act="logActivity" data-id="' + t.id + '">+ Neu</button>') +
      '</div></div>';

    return { title:t.companyName, crumbs:'<a href="#/akquise">Zielkunden</a> <span class="sep">/</span> <b>' + esc(t.companyName) + '</b>', actions, body };
  }

  /* ── Zielkunde bearbeiten ────────────────────────────────── */

        field('Branche','segment',t.segment,'select',{options:segOpts}) +

        field('PLZ','postalCode',t.postalCode,'text') +

        field('Ansprechpartner','contactName',t.contactName,'text') +
        field('Titel / Position','contactTitle',t.contactTitle,'text') +
        field('E-Mail','contactEmail',t.contactEmail,'email') +
        field('Telefon','contactPhone',t.contactPhone,'text') +
        field('LinkedIn','contactLinkedIn',t.contactLinkedIn,'text') +
        field('Anruf-Trigger (UWG)','callTrigger',t.callTrigger,'text') +
        field('Angebotswert (€)','offerValue',t.offerValue || '', 'number') +
        field('Nächster Schritt','nextStep',t.nextStep,'text') +
        field('Fällig am','nextStepDue',t.nextStepDue,'date') +
        field('Verlustgrund','lossReason',t.lossReason,'select',{options:['']. concat(LOSS_REASONS)}) +

    return { title:'Bearbeiten · ' + t.companyName, crumbs:'<a href="#/akquise">Zielkunden</a> <span class="sep">/</span> <a href="#/akquise/' + t.id + '">' + esc(t.companyName) + '</a> <span class="sep">/</span> <b>Bearbeiten</b>', actions:'', body };
  }

  /* ── Prozess-Übersicht ───────────────────────────────────── */
  function viewProcess(t) {
    const cur = stepByStatus(t.status);
    const curOrder = cur ? cur.order : 0;
    const curStage = stageIdxOfStatus(t.status);
    const next = nextUnlocked(t.status);
    const ns = next ? stepByStatus(next) : null;
    const acts = DB.activities.filter((a) => a.targetId === t.id);

    const rail = STAGES.map((stage, si) => {
      const list = stepsOfStage(stage.key);
      const doneStage = curStage > si;
      const isCur = curStage === si;
      return '<div class="stage ' + (doneStage ? 'done' : isCur ? 'current' : 'locked') + '"><div class="stage-top"><span class="stage-num">' + (doneStage ? '✓' : si + 1) + '</span><span class="stage-name">' + esc(stage.label) + '</span></div><div class="steps">' +
        list.map((s) => {
          const isCurStep = s.status === t.status;
          const done = s.order < curOrder;
          const unlocked = isSelectable(t.status, s.status);
          const clickable = done || isCurStep || unlocked;
          const cls = 'step-row ' + (isCurStep ? 'current' : done ? 'done' : clickable ? 'open' : 'locked');
          const badge = isCurStep ? '<span class="mini-b">L ' + guideDone(t, s) + '/' + (s.guide || []).length + ' · E ' + exitCount(t, s) + '/' + (s.exit || []).length + '</span>' : done ? '<span class="mini-b ok">Exit ✓</span>' : clickable ? '<span class="mini-b">offen</span>' : '<span class="mini-b lock">gesperrt</span>';
          return '<a class="' + cls + '"' + (clickable ? ' href="#/akquise/' + t.id + '/prozess/' + s.slug + '"' : '') + '><span class="sdot"></span><span>' + esc(s.label) + '</span>' + badge + '</a>';
        }).join('') + '</div></div>';
    }).join('');

    const nextCard = ns ? '<div class="card"><div class="card-head"><div class="card-title">Nächster Schritt</div><span class="tiny muted">' + esc(STAGES[stageIdxOfStatus(ns.status)].label) + '</span></div><div class="card-body">' +
      '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px">' + statusBadge(t.status) + '<span class="muted">→</span>' + statusBadge(ns.status) + '</div>' +
      '<div style="font-weight:800;font-size:15px;margin-bottom:3px">' + esc(ns.title) + '</div><div class="tiny muted" style="margin-bottom:10px">' + esc(ns.desc) + '</div>' +
      '<div class="tiny" style="font-weight:700;margin-bottom:5px">Exit-Kriterien</div>' +
      '<div class="checklist">' + ns.exit.map((spec) => { const met = exitMet(t, ns, spec); return '<div class="check ' + (met ? 'is-done' : '') + '" style="cursor:default"><input type="checkbox" disabled ' + (met ? 'checked' : '') + '><span class="check-body"><span class="check-text">' + esc(spec.t) + '</span></span>' + (spec.auto ? '<span class="tag auto">auto</span>' : '<span class="tag manual">manuell</span>') + '</div>'; }).join('') + '</div>' +
      '<a class="btn btn-primary" style="margin-top:12px" href="#/akquise/' + t.id + '/prozess/' + ns.slug + '">Schritt öffnen</a>' +
      '</div></div>' : '<div class="card"><div class="card-body"><div class="banner amber" style="margin:0">Der Prozess ist beendet. Ergebnis: <b>' + esc(t.result || t.status) + '</b></div></div></div>';

    const body = '<div class="grid g-main">' +
      card('Akquise-Prozess', '<div class="tiny muted" style="margin-bottom:10px">Jeder Schritt hat eine eigene Seite — Leitfaden und Exit-Kriterien schalten den nächsten Schritt frei.</div>' + '<div class="progress" style="margin-bottom:12px"><span style="width:' + progressPct(t.status) + '%"></span></div>' + rail + '<div style="margin-top:12px">' + nextCard + '</div>', '<span class="badge ' + badgeClass(t.status) + '">' + progressPct(t.status) + ' %</span>') +
      card('Aktivitäten', acts.map(activityRow).join('') || emptyBox('Noch keine Aktivitäten.'), '<button class="btn-link" data-act="logActivity" data-id="' + t.id + '">+ Neu</button>') +
      '</div>';
    return { title:t.companyName + ' · Prozess', crumbs:'<a href="#/akquise">Zielkunden</a> <span class="sep">/</span> <a href="#/akquise/' + t.id + '">' + esc(t.companyName) + '</a> <span class="sep">/</span> <b>Prozess</b>', actions:'<a class="btn btn-ghost btn-sm" href="#/akquise/' + t.id + '">Kundendetails</a>', body };
  }

  /* ── Schritt-Seite (Leitfaden + Exit-Kriterien) ──────────── */
  function viewStep(t, slug) {
    const step = stepBySlug(slug);
    if (!step) return viewNotFound();
    const cur = t.status;
    const isCur = cur === step.status;
    const unlocked = isSelectable(cur, step.status);
    const blocked = cur === 'kein Interesse';
    const canUse = (isCur || unlocked) && !blocked;
    const checks = (t.stepChecks && t.stepChecks[step.slug]) || {};
    const guideFlags = checks.guide || {};
    const exits = step.exit || [];
    const metCount = exits.filter((s) => exitMet(t, step, s)).length;
    const all = metCount === exits.length;
    const phase = STAGES.find((s) => s.key === step.stage);

    const guideHtml = (step.guide || []).map((g, i) => {
      const done = !!guideFlags[i];
      return '<label class="check ' + (done ? 'is-done' : '') + '"><input type="checkbox" data-guide data-step="' + step.slug + '" data-idx="' + i + '" ' + (done ? 'checked' : '') + (canUse ? '' : ' disabled') + '><span class="check-body"><span class="check-text">' + esc(g) + '</span></span></label>';
    }).join('');

    const exitHtml = exits.map((spec) => {
      const met = exitMet(t, step, spec);
      return '<label class="check exit-check ' + (met ? 'is-done' : '') + '"><input type="checkbox" data-exit data-step="' + step.slug + '" data-key="' + esc(spec.k) + '" ' + (met ? 'checked' : '') + (spec.auto || !canUse ? ' disabled' : '') + '><span class="check-body"><span class="check-text">' + esc(spec.t) + '</span>' + (spec.auto ? '<span class="check-hint">Wird automatisch geprüft.</span>' : '') + '</span>' + (spec.auto ? '<span class="tag auto">auto</span>' : '<span class="tag manual">manuell</span>') + '</label>';
    }).join('');

    const fieldHtml = (step.requiredFields || []).length
      ? '<div class="fields">' + step.requiredFields.map((f) => {
          let type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : f.type === 'select' ? 'select' : 'text';
          return field(f.label, 'rf_' + f.payload, t[f.payload] == null ? '' : t[f.payload], type, { req: f.required, options: f.options });
        }).join('') + '</div>'
      : '<div class="tiny muted">Keine Pflichtfelder für diesen Schritt.</div>';

    const banner = blocked ? '<div class="banner red"><div>Kontaktsperre (DSGVO Art. 21) – nur interne Dokumentation erlaubt.</div></div>' :
      (!canUse ? '<div class="banner" style="background:#f9fafb;border-color:var(--line);color:#4b5563"><div><b>Schritt noch gesperrt.</b> Erst die vorherigen Schritte der Pipeline abschließen.</div></div>' : '');

    const body =
      '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">' + statusBadge(cur) + (isCur ? '' : '<span class="muted">→</span>' + '<span class="pill target"><span class="dot"></span>' + esc(step.label) + '</span>') + '<span class="tiny muted" style="margin-left:auto">Aktivität: ' + esc(step.activity) + '</span></div>' +
      banner +
      '<div class="grid g-main">' +
        '<div><section class="card"><div class="card-body">' +
          '<div class="banner blue" style="margin-bottom:14px"><div><b>Ziel</b> · ' + esc(step.desc) + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div class="sec-title" style="margin:0">Leitfaden</div><span class="tiny muted2">hilft, blockiert nicht</span><span class="counter" id="guide-counter" style="margin-left:auto">' + guideDone(t, step) + '/' + (step.guide || []).length + ' erledigt</span></div>' +
          '<div class="checklist" id="guide-list">' + guideHtml + '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;margin:20px 0 6px"><div class="sec-title" style="margin:0">Exit-Kriterien</div><span class="tiny muted2">„Weiter, wenn …“</span><span class="counter' + (all ? ' ok' : '') + '" id="exit-counter" style="margin-left:auto">' + metCount + '/' + exits.length + ' erfüllt</span></div>' +
          '<div class="checklist" id="exit-list">' + exitHtml + '</div>' +
          '<div style="margin-top:20px"><div class="sec-title" style="margin-bottom:8px">Pflichtfelder &amp; Ergebnis</div>' + fieldHtml + '</div>' +
          '<div style="margin-top:14px"><div class="sec-title" style="margin-bottom:6px">Aktivität protokollieren</div><textarea class="input" id="step-note" placeholder="Was ist passiert? Nächster Schritt …">' + esc((t.stepChecks && t.stepChecks[step.slug] && t.stepChecks[step.slug].note) || '') + '</textarea></div>' +
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)">' +
          '<button class="btn ' + (step.status === 'Verlust' || step.status === 'kein Interesse' ? 'btn-red' : isWon(step.status) ? 'btn-green' : 'btn-primary') + '" id="step-save" data-act="saveStep" data-id="' + t.id + '" data-step="' + step.slug + '"' + (canUse && all ? '' : ' disabled') + '>Speichern &amp; weiter</button>' +
          '<a class="btn btn-ghost" href="#/akquise/' + t.id + '/prozess">Abbrechen</a>' +
          '<span class="tiny" id="step-hint" style="color:' + (all ? 'var(--green-700)' : 'var(--amber)') + '">' + (all ? 'Alle Exit-Kriterien erfüllt – Statuswechsel möglich' : 'Noch ' + (exits.length - metCount) + ' Exit-Kriterium offen') + '</span>' +
          '</div>' +
        '</div></section></div>' +
        '<div>' + aiCard('KI-Assistent', '<div class="ai-head">' + AI_SPARK + '<div class="tiny muted">Entwürfe und Analysen – bitte prüfen.</div></div><div class="ai-actions">' +
          (step.stage === 'lead' || step.stage === 'qualifizierung' ? '<button class="btn btn-ghost btn-sm" data-act="ai" data-kind="research" data-id="' + t.id + '">Unternehmen recherchieren</button>' : '') +
          '<button class="btn btn-ghost btn-sm" data-act="ai" data-kind="email" data-id="' + t.id + '" data-step="' + step.slug + '">E-Mail-Entwurf</button>' +
          '<button class="btn btn-ghost btn-sm" data-act="ai" data-kind="summary" data-id="' + t.id + '" data-step="' + step.slug + '">Notiz zusammenfassen</button>' +
          '<button class="btn btn-ghost btn-sm" data-act="ai" data-kind="nextsteps" data-id="' + t.id + '">Nächste Schritte vorschlagen</button>' +
          '</div>') + card('Kontext', '<div class="tiny muted" style="margin-bottom:6px">Phase</div><div style="font-weight:800">' + esc(phase ? phase.label : '') + '</div><div class="progress" style="margin:8px 0 12px"><span style="width:' + progressPct(step.status) + '%"></span></div>' +
          '<div class="tiny muted" style="margin-bottom:4px">Zielkunde</div><a href="#/akquise/' + t.id + '" style="font-weight:700;color:var(--blue-700)">' + esc(t.companyName) + '</a>' +
          '<div class="tiny muted" style="margin-top:10px;margin-bottom:4px">Aktueller Status</div>' + statusBadge(cur)) +
          card('Schritt-Navigation', '<div class="steps">' + stepsOfStage(step.stage).map((s) => '<a class="step-row ' + (s.status === cur ? 'current' : s.order < (stepByStatus(cur) || {}).order ? 'done' : isSelectable(cur, s.status) ? 'open' : 'locked') + '" href="#/akquise/' + t.id + '/prozess/' + s.slug + '"><span class="sdot"></span><span>' + esc(s.label) + '</span></a>').join('') + '</div>') + '</div>' +
      '</div>';
    return { title:step.title, crumbs:'<a href="#/akquise">Zielkunden</a> <span class="sep">/</span> <a href="#/akquise/' + t.id + '">' + esc(t.companyName) + '</a> <span class="sep">/</span> <a href="#/akquise/' + t.id + '/prozess">Prozess</a> <span class="sep">/</span> <b>' + esc(step.label) + '</b>', actions:'<a class="btn btn-ghost btn-sm" href="#/akquise/' + t.id + '">Kundendetails</a>', body };
  }

  /* ── Assessment ──────────────────────────────────────────── */
  function viewAssessment(t) {
    const list = (t.assessments || []).slice().reverse();

  function viewReporting() {
    const inTalk = DB.targets.filter((t) => isInTalk(t.status));
    const won = DB.targets.filter((t) => WON.includes(t.status));
    const lost = DB.targets.filter((t) => LOST.includes(t.status));
    const conversion = DB.targets.length ? Math.round((won.length / DB.targets.length) * 100) : 0;
    const revenue = won.reduce((s, t) => s + (t.offerValue || 0), 0);
    const target = 500000;
    const funnel = STAGES.map((s) => ({ label:s.label, count:DB.targets.filter((t) => (stepByStatus(t.status) || {}).stage === s.key).length }));
    const max = Math.max.apply(null, funnel.map((f) => f.count).concat([1]));
    const segMap = {};

  /* ── Listen-Import ───────────────────────────────────────── */
  const SAMPLE_CSV = 'Unternehmen;Branche;Bundesland;Mitarbeiter;Ort;Kontakt;E-Mail\nMusterbank AG;Banken;Hessen;3400;Frankfurt;A. Beispiel;a.beispiel@musterbank.de\nBeispiel Versicherung;Versicherungen & Finanzvermittler;Bayern;2100;München;M. Muster;m.muster@beispiel-vs.de\nNeue Beratung GmbH;Beratung;Nordrhein-Westfalen;180;Köln;K. Neu;k.neu@neue-beratung.de';
  function parseCsv(text) {
    const lines = String(text || '').trim().split(/\r?\n/).filter(Boolean);
    if (lines.length < 2) return [];
    const delim = lines[0].includes(';') ? ';' : ',';
    const head = lines[0].split(delim).map((h) => h.trim().toLowerCase());
    const get = (row, names) => { for (const n of names) { const i = head.indexOf(n); if (i >= 0) return (row[i] || '').trim(); } return ''; };
    return lines.slice(1).map((line) => {
      const row = line.split(delim);
      return {
        companyName: get(row, ['unternehmen','firma','company','name']),
        segment: get(row, ['branche','segment','industry']),
        bundesland: get(row, ['bundesland','region','state']),
        employees: Number(get(row, ['mitarbeiter','employees','größe','grosse']) || 0) || 0,
        location: get(row, ['ort','stadt','location','city']),
        contactName: get(row, ['kontakt','ansprechpartner','contact']),
        contactEmail: get(row, ['e-mail','email','mail'])
      };
    }).filter((r) => r.companyName);
  }

  document.addEventListener('change', function (e) {
    const target = e.target;
    if (target.matches('[data-filter]')) {
      UI.filters[target.dataset.filter] = target.value;
      applyFilters();
      return;
    }
    if (target.matches('[data-guide]')) {
      const t = findTarget(route().segs[1]);
      const slug = target.dataset.step, idx = target.dataset.idx;
      if (!t) return;
      t.stepChecks = t.stepChecks || {}; t.stepChecks[slug] = t.stepChecks[slug] || { guide:{}, exit:{} }; t.stepChecks[slug].guide = t.stepChecks[slug].guide || {}; t.stepChecks[slug].guide[idx] = target.checked;
      save();
      const step = stepBySlug(slug);
      const c = el('guide-counter'); if (c) c.textContent = guideDone(t, step) + '/' + (step.guide || []).length + ' erledigt';
      target.closest('.check').classList.toggle('is-done', target.checked);
      return;
    }
    if (target.matches('[data-exit]')) {
      const t = findTarget(route().segs[1]);
      const slug = target.dataset.step, key = target.dataset.key;
      if (!t) return;
      t.stepChecks = t.stepChecks || {}; t.stepChecks[slug] = t.stepChecks[slug] || { guide:{}, exit:{} }; t.stepChecks[slug].exit = t.stepChecks[slug].exit || {}; t.stepChecks[slug].exit[key] = target.checked;
      save();
      const step = stepBySlug(slug);
      const met = exitCount(t, step), total = (step.exit || []).length;
      const all = met === total;
      const c = el('exit-counter'); if (c) { c.textContent = met + '/' + total + ' erfüllt'; c.classList.toggle('ok', all); }
      const saveBtn = el('step-save'); if (saveBtn) saveBtn.disabled = !(all && isSelectable(t.status, step.status));
      const hint = el('step-hint'); if (hint) { hint.textContent = all ? 'Alle Exit-Kriterien erfüllt – Statuswechsel möglich' : 'Noch ' + (total - met) + ' Exit-Kriterium offen'; hint.style.color = all ? 'var(--green-700)' : 'var(--amber)'; }
      target.closest('.check').classList.toggle('is-done', target.checked);
      return;
    }
    if (target.matches('[data-handover]')) {
      const t = findTarget(target.dataset.id);
      if (!t) return;
      t.handoverChecklist = t.handoverChecklist || {};
      t.handoverChecklist[target.dataset.index] = target.checked;
      save(); render();
      return;
    }
    if (target.matches('[data-toggle-task]')) {
      const k = DB.tasks.find((x) => x.id === target.dataset.toggleTask);
      if (k) { k.status = target.checked ? 'Done' : 'Open'; save(); render(); }
      return;
    }
    if (target.matches('[data-bafa]')) {
      const t = findTarget(target.dataset.bafa);
      if (t) { t.bafaStatus = target.value; save(); toast('Förderstatus gespeichert'); }
      return;
    }
  });

  function applyFilters() {
    const f = UI.filters;
    const q = (f.q || '').toLowerCase().trim();
    let visible = 0;
    qa('[data-card]').forEach((node) => {
      const ok = (!q || (node.dataset.search || '').includes(q)) && (!f.status || node.dataset.status === f.status) && (!f.priority || node.dataset.priority === f.priority) && (!f.segment || node.dataset.segment === f.segment);
      node.toggleAttribute('hidden', !ok);
      if (ok) visible++;
    });
    const c = el('f-count'); if (c) c.textContent = visible + ' Treffer';
  }

  function exportCsv() {
    const rows = [['Unternehmen','Branche','Bundesland','Ort','Mitarbeiter','Priorität','Status','Angebotswert','Kontakt','E-Mail']];
    DB.targets.forEach((t) => rows.push([t.companyName, t.segment, t.bundesland, t.location, t.employees, t.priority, t.status, t.offerValue || 0, t.contactName, t.contactEmail]));
    const csv = '\ufeff' + rows.map((r) => r.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'zielkunden.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('CSV exportiert');
  }

  function generateAssessment(t) {
    if (!t) return;
    t.assessments = t.assessments || [];
    const score = Math.round((2.6 + Math.random() * 2) * 10) / 10;
    const cats = [{ name:'Daten', score:Math.round((2 + Math.random() * 3) * 10) / 10 }, { name:'Kultur', score:Math.round((2 + Math.random() * 3) * 10) / 10 }, { name:'Technologie', score:Math.round((2 + Math.random() * 3) * 10) / 10 }];
    const uc = [
      { title:'Automatisierte Dokumentenprüfung', desc:'KI-gestützte Vorprüfung von Vertragsunterlagen.', value:'~ 120 h/Jahr' },
      { title:'Assistent für Kundenanfragen', desc:'Antwortvorschläge aus Wissensbasis für den Service.', value:'~ 80 h/Jahr' }
    ];
    t.assessments.push({ version:t.assessments.length + 1, createdAt:todayISO(), score, categories:cats, usecases:uc });
    t.selfTestScore = Math.round(score * 20); t.selfTestDate = todayISO();
    save(); render(); toast('Assessment generiert');
  }
  function confirmHandover(t) {
    if (!t) return;
    const chk = t.handoverChecklist || {};
    const done = HANDOVER.filter((h, i) => chk[i]).length;
    if (done !== HANDOVER.length) { toast('Bitte alle 6 Punkte abhaken', true); return; }
    t.status = 'gewonnen'; t.result = 'gewonnen'; t.decisionDate = todayISO(); ensureAccount(t);
    logActivity(t.id, 'Note', 'Übergabe bestätigt, Kunde gewonnen.');
    save(); location.hash = '#/akquise/' + t.id; render(); toast('Übergabe bestätigt · Kunde gewonnen');
  }
  function openContactModal(c) {
    const isEdit = !!c;
    openModal(isEdit ? 'Kontakt bearbeiten' : 'Neuer Kontakt', '<form data-form="contactSave"><input type="hidden" name="id" value="' + (isEdit ? c.id : '') + '"><div class="fields">' +
      field('Zielkunde','targetId',isEdit ? c.targetId : '', 'select',{options:DB.targets.map((t) => ({ value:t.id, label:t.companyName })),req:true}) +
      field('Name','name',isEdit ? c.name : '', 'text',{req:true}) +
      field('Rolle','role',isEdit ? c.role : '', 'text') +
      field('E-Mail','email',isEdit ? c.email : '', 'email') +
      field('Telefon','phone',isEdit ? c.phone : '', 'text') +
      field('LinkedIn','linkedin',isEdit ? c.linkedin : '', 'text') +
      '</div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-act="closeModal">Abbrechen</button><button class="btn btn-primary" type="submit">Speichern</button></div></form>');
  }
  function submitContact(v) {
    if (v.id) { const c = DB.contacts.find((x) => x.id === v.id); if (c) Object.assign(c, { targetId:v.targetId, name:v.name, role:v.role, email:v.email, phone:v.phone, linkedin:v.linkedin }); }
    else DB.contacts.unshift({ id: uid('c'), targetId:v.targetId, name:v.name, role:v.role, email:v.email, phone:v.phone, linkedin:v.linkedin, isPrimary:false });
    save(); closeModal(); render(); toast('Kontakt gespeichert');
  }
  function openTemplateModal(tp) {
    const isEdit = !!tp;
    openModal(isEdit ? 'Vorlage bearbeiten' : 'Neue Vorlage', '<form data-form="templateSave"><input type="hidden" name="id" value="' + (isEdit ? tp.id : '') + '"><div class="fields">' +
      field('Name','name',isEdit ? tp.name : '', 'text',{req:true}) +
      field('Kanal','channel',isEdit ? tp.channel : 'E-Mail','select',{options:['E-Mail','LinkedIn','Telefon']}) +
      field('Betreff','subject',isEdit ? tp.subject : '', 'text',{full:true}) +
      field('Text','body',isEdit ? tp.body : '', 'textarea',{full:true, hint:'Platzhalter: {unternehmen}, {ansprechpartner}, {branche}, {datum}, {absender}'}) +
      field('Notiz','notes',isEdit ? tp.notes : '', 'text',{full:true}) +
      '</div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-act="closeModal">Abbrechen</button><button class="btn btn-primary" type="submit">Speichern</button></div></form>');
  }
  function submitTemplate(v) {
    if (v.id) { const t = DB.templates.find((x) => x.id === v.id); if (t) Object.assign(t, { name:v.name, channel:v.channel, subject:v.subject, body:v.body, notes:v.notes }); }
    else DB.templates.unshift({ id: uid('tp'), name:v.name, channel:v.channel, subject:v.subject, body:v.body, notes:v.notes, usageCount:0, active:true });
    save(); closeModal(); render(); toast('Vorlage gespeichert');
  }
  function openAssignee(targetId, role) {
    const t = findTarget(targetId); if (!t) return;
    const taken = (t.assignments || []).filter((a) => a.role === role).map((a) => a.userId);
    const options = DB.users.filter((u) => !taken.includes(u.id));
    openModal('Mitarbeiter zuweisen · ' + ROLE_LABELS[role], '<div class="checklist">' + (options.map((u) => '<button class="check" style="text-align:left" data-act="doAssign" data-target="' + targetId + '" data-role="' + role + '" data-user="' + u.id + '"><span class="av">' + esc(initials(u.name)) + '</span><span class="check-body"><span class="check-text">' + esc(u.name) + '</span><span class="check-hint">' + esc(u.portalRole) + '</span></span></button>').join('') || emptyBox('Alle verfügbaren Personen sind bereits zugewiesen.')) + '</div>');
  }
  document.addEventListener('click', function (e) {
    const b = e.target.closest('[data-act="doAssign"]');
    if (!b) return;
    const t = findTarget(b.dataset.target); if (!t) return;
    t.assignments = t.assignments || [];
    t.assignments.push({ userId:b.dataset.user, role:b.dataset.role });
    save(); closeModal(); render(); toast('Zugewiesen');
  });
  function openMemberModal() {
    openModal('Mitglied anlegen', '<form data-form="memberNew"><div class="fields">' +
      field('Name','name','','text',{req:true}) + field('E-Mail','email','','email') +
      field('Rolle','portalRole','KI-Experte','select',{options:['Lead Berater','KI-Experte','Vertrieb']}) +
      '</div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-act="closeModal">Abbrechen</button><button class="btn btn-primary" type="submit">Anlegen</button></div></form>');
  }
  document.addEventListener('submit', function (e) {
    const f = e.target.closest('form[data-form="memberNew"]');
    if (!f) return;
    e.preventDefault();
    const v = formValues(f);
    DB.users.push({ id: uid('u'), name:v.name, email:v.email, role:v.portalRole, portalRole:v.portalRole });
    save(); closeModal(); render(); toast('Mitglied angelegt');
  });
  function openTaskModal() {
    openModal('Neue Aufgabe', '<form data-form="taskNew"><div class="fields">' +
      field('Titel','title','','text',{req:true,full:true}) +
      field('Zielkunde','targetId','','select',{options:DB.targets.map((t) => ({ value:t.id, label:t.companyName }))}) +
      field('Verantwortlich','assignedToId','','select',{options:DB.users.map((u) => ({ value:u.id, label:u.name }))}) +
      field('Fällig','dueDate',todayISO(),'date') +
      field('Priorität','priority','Mittel','select',{options:['Hoch','Mittel','Niedrig']}) +
      '</div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-act="closeModal">Abbrechen</button><button class="btn btn-primary" type="submit">Anlegen</button></div></form>');
  }
  function submitTask(v) {
    DB.tasks.unshift({ id: uid('k'), targetId:v.targetId, title:v.title, dueDate:v.dueDate, assignedToId:v.assignedToId, status:'Open', priority:v.priority });
    save(); closeModal(); render(); toast('Aufgabe angelegt');
  }
  function openDocModal() {
    openModal('Dokument hinzufügen', '<form data-form="docNew"><div class="fields">' +
      field('Name','name','','text',{req:true,full:true,placeholder:'z.B. Assessment-2026-11.pdf'}) +
      field('Zielkunde','targetId','','select',{options:DB.targets.map((t) => ({ value:t.id, label:t.companyName }))}) +
      '</div><div class="modal-actions"><button type="button" class="btn btn-ghost" data-act="closeModal">Abbrechen</button><button class="btn btn-primary" type="submit">Hinzufügen</button></div></form>');
  }
  function submitDoc(v) {
    DB.documents.unshift({ id: uid('d'), targetId:v.targetId, name:v.name, createdAt:todayISO() });
    save(); closeModal(); render(); toast('Dokument hinzugefügt');
  }
  function submitOffer(v) {
    const pkg = DB.settings.packages.find((p) => p.key === v.package) || DB.settings.packages[1];
    const year = String(v.year || new Date().getFullYear());
    const seq = String(DB.offers.length + 1).padStart(4, '0');
    const o = { id: uid('o'), number:'SP-' + year + '-' + seq, targetId:v.targetId, status:'entwurf', validUntil:v.validUntil, createdAt:todayISO(), items:[{ label:pkg.label + '-Paket', qty:1, price:pkg.price }] };
    DB.offers.unshift(o);
    const t = findTarget(v.targetId);
    if (t) { t.offerValue = offerTotal(o); logActivity(t.id, 'Note', 'Angebot ' + o.number + ' angelegt'); }
    save(); location.hash = '#/offers/' + o.id; render(); toast('Angebot ' + o.number + ' angelegt');
  }
  function saveStep(id, slug) {
    const t = findTarget(id); const step = stepBySlug(slug); if (!t || !step) return;
    if (!isSelectable(t.status, step.status)) { toast('Übergang nicht erlaubt', true); return; }
    if (!allExits(t, step)) { toast('Nicht alle Exit-Kriterien erfüllt', true); return; }
    // save required fields
    const form = document.querySelector('form[data-form]');
    qa('[name^="rf_"]').forEach((inp) => { const key = inp.name.slice(3); t[key] = inp.type === 'number' ? Number(inp.value) : inp.value; });
    const note = el('step-note'); const summary = note ? note.value : '';
    t.stepChecks = t.stepChecks || {}; t.stepChecks[slug] = t.stepChecks[slug] || { guide:{}, exit:{} }; t.stepChecks[slug].note = summary;
    t.status = step.status;
    if (WON.includes(step.status)) { t.result = 'gewonnen'; ensureAccount(t); }
    if (LOST.includes(step.status)) { t.result = 'verloren'; if (step.status === 'kein Interesse') addBlocklist(t); }
    DB.activities.unshift({ id: uid('a'), targetId:t.id, type:step.activity, date:todayISO(), duration:step.activity === 'Call' ? 15 : step.activity === 'Meeting' ? 60 : 0, summary:summary || ('Statuswechsel → ' + step.label), nextSteps:'', createdBy:currentUser().name });
    if (step.activity === 'Call') t.callAttempts = Math.min(3, (t.callAttempts || 0) + 1);
    save();
    const next = nextUnlocked(step.status);
    const ns = next ? stepByStatus(next) : null;
    if (ns) location.hash = '#/akquise/' + t.id + '/prozess/' + ns.slug;
    else location.hash = '#/akquise/' + t.id + '/prozess';
    render(); toast('Status: ' + esc(step.label));
  }
  function commitImport() {
    const rows = UI.importRows || [];
    let added = 0, skipped = 0;
    rows.forEach((r) => {
      const dup = DB.targets.some((t) => t.companyName.toLowerCase() === r.companyName.toLowerCase());
      const blocked = DB.blocklist.some((b) => b.companyName.toLowerCase() === r.companyName.toLowerCase());
      if (dup || blocked || !r.companyName) { skipped++; return; }
      DB.targets.unshift({ id: uid('t'), companyName:r.companyName, segment:r.segment || DB.settings.segments[0], bundesland:r.bundesland || '', location:r.location || '', street:'', postalCode:'', employees:r.employees || 0, priority:'P2', status:'offen', contactName:r.contactName || '', contactTitle:'', contactEmail:r.contactEmail || '', contactPhone:'', contactLinkedIn:'', contactSource:'Import', callAttempts:0, callTrigger:'', emailAllowed:null, emailConsentAt:'', emailConsentSource:'', emailConsentRevokedAt:'', privacyNoticeAt:'', privacyNoticeSource:'', callConsentAt:'', callConsentSource:'', offerValue:0, offerDate:'', nextStep:'', nextStepDue:'', notes:'', selfTestScore:null, selfTestDate:'', selfTestLink:'', bafaStatus:'', bafaApprovedAmount:0, lossReason:'', result:'', handoverDate:'', firstMeetingDate:'', decisionDate:'', package:'standard', stepChecks:{}, assignments:[], account:'', assessments:[], handoverChecklist:{}, createdAt:todayISO() });
      added++;
    });
    UI.importRows = null; save(); location.hash = '#/akquise'; render(); toast(added + ' importiert, ' + skipped + ' übersprungen');
  }
  function submitSettingsQuotas(v) {
    Object.assign(DB.settings.quotas, { linkedin:Number(v.linkedin), calls:Number(v.calls), hoursPerWeek:Number(v.hoursPerWeek), days:Number(v.days), firms:Number(v.firms) });
    DB.settings.sprint = { start:v.start, end:v.end };
    save(); render(); toast('Quoten gespeichert');
  }
  function submitSettingsPackages(v) {
    DB.settings.packages.forEach((p, i) => { p.price = Number(v['price_' + i]) || p.price; p.description = v['desc_' + i] || p.description; });
    save(); render(); toast('Pakete gespeichert');
  }
  function submitSettingsSegments(v) {
    DB.settings.segments = String(v.segments || '').split(/\n/).map((s) => s.trim()).filter(Boolean);
    save(); render(); toast('Branchen gespeichert');
  }
  function submitSettingsLinkedin(v) {
    DB.settings.linkedin = { dailyLimit:Number(v.dailyLimit), weeklyTarget:Number(v.weeklyTarget) };
    save(); render(); toast('LinkedIn gespeichert');
  }
  function submitMarket(v) {
    DB.regions.forEach((r, i) => { r.priority = Number(v['prio_' + i]); r.note = v['note_' + i]; r.active = !!v['active_' + i]; });
    DB.wz.forEach((w, i) => { w.priority = v['wzp_' + i]; w.note = v['wzn_' + i]; });
    save(); render(); toast('Marktauswahl gespeichert');
  }

  /* Drag & Drop (Kanban) */
  let dragId = null;
  document.addEventListener('dragstart', (e) => {
    const cardEl = e.target.closest('.kan-card');
    if (!cardEl) return;
    dragId = cardEl.dataset.id;
    cardEl.classList.add('dragging');
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  });
  document.addEventListener('dragend', (e) => { const c = e.target.closest('.kan-card'); if (c) c.classList.remove('dragging'); dragId = null; qa('.kan-col').forEach((col) => col.classList.remove('over')); });
  document.addEventListener('dragover', (e) => { const col = e.target.closest('[data-phase]'); if (col) { e.preventDefault(); col.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const col = e.target.closest('[data-phase]'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
  document.addEventListener('drop', (e) => {
    const col = e.target.closest('[data-phase]');
    if (!col) return;
    e.preventDefault(); col.classList.remove('over');
    const t = findTarget(dragId); if (!t) return;
    if ((stepByStatus(t.status) || {}).stage === col.dataset.phase) return;
    const ok = advanceToPhase(t, col.dataset.phase);
    if (!ok) toast('Übergang nicht erlaubt', true);
    render();
  });

  /* Init */
  buildSidebar();
  if (!location.hash) location.hash = '#/dashboard';
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
