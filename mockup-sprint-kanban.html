  function cardHtml(z) {
    var prioCls = z.prio === 3 ? 'p-h' : (z.prio === 2 ? 'p-m' : 'p-l');
    var prioTxt = z.prio === 3 ? 'Hoch' : (z.prio === 2 ? 'Mittel' : 'Niedrig');
    var contact = z.c ? z.c + (z.calls ? ' · ' + z.calls + (z.calls === 1 ? ' Anruf' : ' Anrufe') : '') : 'Noch kein Kontakt';
    var pkgHtml = z.pkg ? '<span class="kb-pkg pkg-' + z.pkg.toLowerCase() + '">' + z.pkg + '</span>' : '';
    var valHtml = z.val ? '<div class="kb-val' + (z.st === 'gewonnen' ? ' won' : '') + '">' + euro(z.val) + '</div>' : '';
    return '<a class="kb-card ' + prioCls + (z.st === 'gewonnen' ? ' is-won' : '') + '" href="mockup-sprint-detail.html" draggable="true" data-id="' + z.id + '" title="' + esc(z.n) + ' · Priorität ' + prioTxt + '">' +
      '<span class="kb-card-name">' + esc(z.n) + '</span>' +
      '<div class="kb-card-sub">' + esc(z.seg) + ' · ' + esc(z.reg) + '</div>' +
      '<div class="kb-card-meta"><span class="kb-emp">' + esc(z.ma) + '</span>' + pkgHtml + '</div>' +
      valHtml +
      '<div class="kb-card-foot"><span class="kb-contact">' + esc(contact) + '</span>' +
        '<span class="kb-right"><span class="kb-age" title="Tage in dieser Phase">' + z.d + ' T</span>' +
        '<span class="kb-avatar" style="background:' + OWNERS[z.o] + '" title="' + OWNER_NAMES[z.o] + '">' + z.o + '</span></span>' +
      '</div></a>';
  }

  function render() {
    var visible = DATA.filter(matches);
    var html = '';
    COLUMNS.forEach(function (c) {
      var cards = visible.filter(function (z) { return z.st === c.key; })
        .sort(function (a, b) {
          if (b.prio !== a.prio) return b.prio - a.prio;
          return a.n.localeCompare(b.n, 'de');
        });
      html += '<section class="kanban-column kb-col col-' + c.key + '" data-status="' + c.key + '">' +
        '<div class="kb-col-head"><span class="kb-col-dot" style="background:' + c.dot + '"></span>' +
        '<span class="kb-col-title">' + c.label + '</span>' +
        '<span class="kb-col-count">' + cards.length + '</span></div>' +
        '<div class="kb-col-body" data-status="' + c.key + '">' +
        (cards.length ? cards.map(cardHtml).join('') : '<div class="kb-empty">Keine Treffer</div>') +
        '</div></section>';
    });
    board.innerHTML = html;
    var filtered = state.seg || state.q;
    document.getElementById('result').innerHTML = filtered
      ? '<b>' + visible.length + '</b> von ' + DATA.length + ' Zielkunden'
      : '<b>' + DATA.length + '</b> Zielkunden';
    resetBtn.hidden = !filtered;
  }

  function renderChips() {
    var all = ['Alle'].concat(SEGMENTS);
    chips.innerHTML = all.map(function (seg) {
      var active = (seg === 'Alle' && !state.seg) || seg === state.seg;
      return '<button class="filter-btn' + (active ? ' active' : '') + '" type="button" data-seg="' + (seg === 'Alle' ? '' : seg) + '">' + seg + '</button>';
    }).join('');
  }

  chips.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.filter-btn') : null;
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    state.seg = btn.getAttribute('data-seg');
    var all = chips.querySelectorAll('.filter-btn');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i] === btn);
    render();
  });

  search.addEventListener('input', function () {
    state.q = search.value.trim();
    render();
  });

  resetBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    state.seg = '';
    state.q = '';
    search.value = '';
    renderChips();
    render();
  });

  document.getElementById('btn-export').addEventListener('click', function (e) {
    e.stopPropagation();
    toast('Zielkunden-Export wird vorbereitet (Demo)');
  });

  // Drag & drop between columns
  board.addEventListener('dragstart', function (e) {
    var card = e.target.closest ? e.target.closest('.kb-card') : null;
    if (!card) return;
    dragId = card.getAttribute('data-id');
    card.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
    }
  });

  board.addEventListener('dragend', function () {
    var el = board.querySelector('.kb-card.dragging');
    if (el) el.classList.remove('dragging');
    var t = board.querySelector('.drop-target');
    if (t) t.classList.remove('drop-target');
    dragId = null;
  });

  board.addEventListener('dragover', function (e) {
    var body = e.target.closest ? e.target.closest('.kb-col-body') : null;
    if (!body) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    var current = board.querySelector('.drop-target');
    if (current !== body) {
      if (current) current.classList.remove('drop-target');
      body.classList.add('drop-target');
    }
  });

  board.addEventListener('dragleave', function (e) {
    var body = e.target.closest ? e.target.closest('.kb-col-body') : null;
    if (body && !body.contains(e.relatedTarget)) body.classList.remove('drop-target');
  });

  board.addEventListener('drop', function (e) {
    var body = e.target.closest ? e.target.closest('.kb-col-body') : null;
    if (!body) return;
    e.preventDefault();
    var id = dragId;
    if (!id && e.dataTransfer) { try { id = e.dataTransfer.getData('text/plain'); } catch (err) {} }
    var z = null;
    for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) { z = DATA[i]; break; }
    var target = body.getAttribute('data-status');
    if (!z || !target || z.st === target) return;
    var from = labelOf(z.st);
    z.st = target;
    render();
    updateStats();
    toast('„' + z.n + '“: ' + from + ' → ' + labelOf(target));
  });

  // Initial render
  renderChips();
  render();
  updateStats();
})();
</script>
</body>
</html>
